<h1 class="text-2xl font-bold mb-4">Créer un sondage</h1>

<form [formGroup]="surveyForm" (ngSubmit)="submit()" class="space-y-6">

  <!-- Nom -->
  <div>
    <label class="block mb-1 font-semibold">Nom du sondage</label>
    <input formControlName="name"
           class="w-full border px-3 py-2 rounded"
           placeholder="Ex. Sondage de satisfaction" />
  </div>

  <!-- Questions -->
  <div formArrayName="questions" class="space-y-4">
    <h2 class="text-lg font-semibold">{{ questionLabel() }}</h2>

    <ng-container *ngFor="let q of questions.controls; let i = index">
      <div [formGroupName]="i" class="question-card space-y-3">

        <!-- Intitulé -->
        <input formControlName="title"
               class="w-full border px-3 py-2 rounded"
               placeholder="Intitulé de la question" />

        <!-- Type -->
        <select formControlName="type" class="border px-3 py-1 rounded">
          <option value="text">Texte libre</option>
          <option value="radio">Choix unique</option>
          <option value="checkbox">Choix multiple</option>
          <option value="select">Liste déroulante</option>
        </select>

        <!-- Options (pour QCM) -->
        <ng-container *ngIf="q.get('type')!.value !== 'text'">
          <div formArrayName="options" class="space-y-2">
            <ng-container
              *ngFor="let opt of q.get('options')['controls']; let j = index">
              <div [formGroupName]="j" class="flex gap-2">
                <input [formControlName]="null" class="flex-grow border px-3 py-1 rounded"
                       placeholder="Option" />
                <button type="button" (click)="removeOption(i, j)"
                        class="text-red-600 text-sm">X</button>
              </div>
            </ng-container>
          </div>
          <button type="button" (click)="addOption(i)"
                  class="text-sm bg-gray-200 px-2 py-1 rounded">Ajouter option</button>
        </ng-container>

        <!-- Supprimer question -->
        <button type="button" (click)="removeQuestion(i)"
                class="text-sm text-red-600">Supprimer</button>
      </div>
    </ng-container>
  </div>

  <!-- Boutons -->
  <div class="flex justify-end gap-2">
    <button type="button" (click)="addQuestion()"
            class="bg-gray-300 px-4 py-2 rounded">Ajouter une question</button>
    <button type="submit"
            class="bg-blue-600 text-white px-6 py-2 rounded"
            [disabled]="saving()">Enregistrer</button>
  </div>
</form>
