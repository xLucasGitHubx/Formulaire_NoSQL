<h1 class="text-2xl font-bold mb-4">Créer un sondage</h1>

<form
  [formGroup]="surveyForm"
  (ngSubmit)="submit()"
  class="space-y-6"
>
  <!-- 1) Champ “Nom du sondage” -->
  <div>
    <label class="block mb-1 font-semibold">Nom du sondage</label>
    <input
      formControlName="name"
      type="text"
      class="w-full border px-3 py-2 rounded"
      placeholder="Ex. Sondage de satisfaction"
      required
    />
  </div>

  <!-- 2) Zone “Questions” : on lie ici le FormArray 'questions' défini en TS -->
  <div formArrayName="questions" class="space-y-6">
    <h2 class="text-lg font-semibold">{{ questionLabel() }}</h2>

    <!-- Boucle sur questions.controls (chaque élément est un FormGroup) -->
    <ng-container *ngFor="let qCtrl of questions.controls; let i = index">
      <div
        [formGroupName]="i"
        class="question-card p-4 border rounded bg-gray-50 space-y-3"
      >
        <!-- a) Intitulé de la question -->
        <div>
          <label class="block font-medium mb-1">Question {{ i + 1 }}</label>
          <input
            formControlName="title"
            type="text"
            class="w-full border px-3 py-2 rounded"
            placeholder="Intitulé de la question"
            required
          />
        </div>

        <!-- b) Type de la question -->
        <div>
          <label class="block font-medium mb-1">Type</label>
          <select
            formControlName="type"
            class="border px-3 py-2 rounded"
          >
            <option value="text">Texte libre</option>
            <option value="radio">Choix unique</option>
            <option value="checkbox">Choix multiple</option>
            <option value="select">Liste déroulante</option>
          </select>
        </div>

        <!-- c) Si le type ≠ "text", on affiche le FormArray “options” -->
        <ng-container *ngIf="getQuestionType(i) !== 'text'">
          <div formArrayName="options" class="space-y-2">
            <label class="block font-medium">Options</label>
            <ng-container
              *ngFor="let optCtrl of getOptions(i).controls; let j = index"
            >
              <div class="flex items-center gap-2">
                <input
                  [formControlName]="j"
                  type="text"
                  class="flex-grow border px-3 py-1 rounded"
                  placeholder="Texte de l’option"
                  required
                />
                <button
                  type="button"
                  (click)="removeOption(i, j)"
                  class="text-red-600 text-sm"
                >
                  ×
                </button>
              </div>
            </ng-container>
          </div>
          <button
            type="button"
            (click)="addOption(i)"
            class="mt-2 text-sm bg-gray-200 px-2 py-1 rounded"
          >
            Ajouter une option
          </button>
        </ng-container>

        <!-- d) Bouton “Supprimer cette question” -->
        <button
          type="button"
          (click)="removeQuestion(i)"
          class="mt-4 text-red-600 text-sm"
        >
          Supprimer la question
        </button>
      </div>
    </ng-container>
  </div>

  <!-- 3) Boutons “Ajouter une question” et “Enregistrer” en bas du form -->
  <div class="flex justify-end gap-2 mt-4">
    <button
      type="button"
      (click)="addQuestion()"
      class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400"
    >
      Ajouter une question
    </button>
    <button
      type="submit"
      class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700"
      [disabled]="saving()"
    >
      Enregistrer
    </button>
  </div>
</form>
