<!-- take-survey.component.html -->
<ng-container *ngIf="survey; else loading">
  <h1 class="text-2xl font-bold mb-4">{{ survey.name }}</h1>

  <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

    <!-- Boucle des questions -->
    <div *ngFor="let q of survey.questions" class="question-card space-y-2">
      <p class="font-semibold">{{ q.title }}</p>

      <!-- Choix du rendu via ngSwitch -->
      <ng-container [ngSwitch]="q.type">

        <!-- Texte libre -->
        <input *ngSwitchCase="'text'"
               type="text"
               class="w-full border px-3 py-2 rounded"
               [formControlName]="q.title" />

        <!-- Choix unique -->
        <div *ngSwitchCase="'radio'" class="space-y-1">
          <label *ngFor="let opt of q.options" class="inline-flex gap-2">
            <input type="radio" [value]="opt.label" [formControlName]="q.title" />
            <span>{{ opt.label }}</span>
          </label>
        </div>

        <!-- Choix multiple -->
        <div *ngSwitchCase="'checkbox'" class="space-y-1">
          <label *ngFor="let opt of q.options" class="inline-flex gap-2">
            <input type="checkbox"
                   [checked]="form.controls[q.title].value?.includes(opt.label)"
                   (change)="toggleCheckbox(q.title, opt.label, $event.target.checked)" />
            <span>{{ opt.label }}</span>
          </label>
        </div>

        <!-- Liste déroulante -->
        <select *ngSwitchCase="'select'"
                class="border px-3 py-1 rounded"
                [formControlName]="q.title">
          <option *ngFor="let opt of q.options" [value]="opt.label">
            {{ opt.label }}
          </option>
        </select>

      </ng-container>
    </div>

    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">
      Envoyer
    </button>
  </form>

  <p *ngIf="submitted" class="text-green-600">Merci pour votre participation !</p>
</ng-container>

<ng-template #loading><p>Chargement…</p></ng-template>
